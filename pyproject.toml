[project]
name = "banco-amazonico-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: errores · I: imports ordenados · B: bugs comunes · S: seguridad (bandit) · UP: sintaxis moderna
# C90: complejidad ciclomática (V(G) ≤ 10, como en el plan de calidad)
select = ["E", "F", "I", "B", "S", "UP", "C90", "BLE"]
ignore = ["B008"]  # Depends() en argumentos es el patrón de FastAPI

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y claves de prueba son normales en tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
